name: maple_bear_valqueire
description: App de Secretaria - Maple Bear Valqueire
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # HTTP & API
  dio: ^5.4.3
  retrofit: ^4.1.0

  # Navigation
  go_router: ^13.2.4

  # Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0

  # UI Components
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  fl_chart: ^0.67.0
  table_calendar: ^3.1.2
  intl: ^0.19.0
  badges: ^3.1.2

  # Utils
  mask_text_input_formatter: ^2.9.0
  currency_text_input_formatter: ^2.1.1
  url_launcher: ^6.2.6
  path_provider: ^2.1.3
  image_picker: ^1.1.2
  pdf: ^3.11.1
  printing: ^5.13.1
  open_file: ^3.3.2
  lottie: ^3.1.2
  flutter_local_notifications: ^17.1.2
  connectivity_plus: ^6.0.3
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  retrofit_generator: ^8.1.0
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: MapleBear
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
